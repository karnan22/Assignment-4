<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todolist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="bg-[url(https://ik.imagekit.io/4z8covdo9/Full%20stack/todolistbg.png?updatedAt=1700761069523)] bg-no-repeat bg-cover w-[400px] h-[600px] flex flex-col items-center justify-start">
        <div class="flex flex-col items-center justify-center font-[roboto]">
        <h1 class="text-white text-[50px] font-bold">To Do List</h1>
        <p class="text-white">Each day I will accomplish one thing on my todo list</p>
            </div>

            <div class="flex flex-col items-start py-3 px-2 justify-start">
                <h2 class="text-white mb-[10px]">Read Book</h2>
                <p class="text-white">I dont't think that the human race will survive the next thousand years, unless we spread into space. There are too many accidents that can befall life on a single planet. But I'm an optimist...</p>
                
            </div>
            <div class="flex flex-col items-center justify-center gap-3">
                <button class="bg-[#ffa61c] text-white font-bold py-2 px-4 rounded">Start</button>
                <a href="#" class="text-white underline hover:underline-offset-4">Don't skip introduction</a>
            </div>
    
    </div>

    
</body>
</html>
